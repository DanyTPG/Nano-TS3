name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for latest / tag ref)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_zig: true
            platform_type: linux

          - name: linux-amd64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_zig: true
            platform_type: linux

          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_zig: true
            platform_type: linux

          - name: linux-arm64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_zig: true
            platform_type: linux

          - name: linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            use_zig: true
            platform_type: linux

          - name: linux-armv7-musl
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            use_zig: true
            platform_type: linux

          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_zig: false
            platform_type: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Zig
        if: matrix.use_zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.use_zig
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build binary (with cargo-zigbuild)
        if: matrix.use_zig
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build binary (with native cargo)
        if: "!matrix.use_zig"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Linux standalone raw binaries
        if: matrix.platform_type == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/nano-ts3" "dist/nano-ts3-${{ matrix.name }}"
          chmod +x "dist/nano-ts3-${{ matrix.name }}"

          # Provide aarch64 aliases for arm64 targets
          if [ "${{ matrix.name }}" = "linux-arm64" ]; then
            cp "dist/nano-ts3-${{ matrix.name }}" "dist/nano-ts3-linux-aarch64"
            chmod +x "dist/nano-ts3-linux-aarch64"
          fi
          if [ "${{ matrix.name }}" = "linux-arm64-musl" ]; then
            cp "dist/nano-ts3-${{ matrix.name }}" "dist/nano-ts3-linux-aarch64-musl"
            chmod +x "dist/nano-ts3-linux-aarch64-musl"
          fi

          if [ -f "target/${{ matrix.target }}/release/dump_cmd" ]; then
            cp "target/${{ matrix.target }}/release/dump_cmd" "dist/dump_cmd-${{ matrix.name }}"
            chmod +x "dist/dump_cmd-${{ matrix.name }}"
          fi
          if [ -f "target/${{ matrix.target }}/release/test_cmds" ]; then
            cp "target/${{ matrix.target }}/release/test_cmds" "dist/test_cmds-${{ matrix.name }}"
            chmod +x "dist/test_cmds-${{ matrix.name }}"
          fi

      - name: Prepare Windows standalone raw binaries (.exe)
        if: matrix.platform_type == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/nano-ts3.exe" "dist/nano-ts3-${{ matrix.name }}.exe"
          if (Test-Path "target/${{ matrix.target }}/release/dump_cmd.exe") {
            Copy-Item "target/${{ matrix.target }}/release/dump_cmd.exe" "dist/dump_cmd-${{ matrix.name }}.exe"
          }
          if (Test-Path "target/${{ matrix.target }}/release/test_cmds.exe") {
            Copy-Item "target/${{ matrix.target }}/release/test_cmds.exe" "dist/test_cmds-${{ matrix.name }}.exe"
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Binaries to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'binaries-*'
          path: dist
          merge-multiple: true

      - name: Generate unified SHA256 checksums
        working-directory: dist
        shell: bash
        run: |
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          echo "Raw binary files prepared for release:"
          ls -lh

      - name: Determine release tag and names
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            IS_PRERELEASE="false"
            MAKE_LATEST="true"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            IS_PRERELEASE="false"
            MAKE_LATEST="true"
          else
            TAG_NAME="latest"
            IS_PRERELEASE="true"
            MAKE_LATEST="false"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Publish raw binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.tag_name == 'latest' && 'Latest Automated Build' || steps.release_info.outputs.tag_name }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.release_info.outputs.make_latest }}
          files: |
            dist/*
          generate_release_notes: true
